name: weekly-discovery
on:
  # 每周日 08:00（上海时区）自动触发；跑在自然周末尾，首页才能显示完整一周。
  schedule:
    - cron: "0 8 * * 0"
      timezone: "Asia/Shanghai"
  workflow_dispatch: {}
concurrency: {group: weekly-discovery, cancel-in-progress: false}
permissions: {contents: write, issues: write}
env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  run:
    runs-on: ubuntu-latest
    # daily 模式下 weekly 只做 聚合→归档→卡片→issue;聚合会补跑缺失日
    # (每天由 llm.max_seconds 封顶 65 分钟 + 搜索 8 分钟,max_backfill_days=2 →
    # 最坏 2×73=146 分钟),再加归档 30~40 分钟。weekly 步骤 200 分钟超时,
    # job 215 给 setup/issue/commit 留余量。
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install ghresearcher pyrepowiki-cli -r requirements.txt
      - run: npm install -g degit
      - run: command -v repowiki-cli && command -v degit
      - name: llm doctor
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/llm_doctor.py
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      - name: weekly
        # 步骤超时而不是让 job 超时:job 被杀会跳过下面的 open issue / commit,
        # 把本次聚合和归档结果全部丢掉。补跑日已按 max_seconds 封顶,
        # 最坏 2×73+40 ≈ 186 分钟;步骤 200 留余量给 issue/commit。
        # 下面两步用 if: always() 保证失败/超时后仍落库,同时保留红色失败信号。
        timeout-minutes: 200
        run: bash scripts/run_weekly.sh
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          ZREAD_TOKEN: ${{ secrets.ZREAD_TOKEN }}
      - name: open issue
        if: always()
        run: |
          : > data/latest_issue.txt
          if [ -s /tmp/issue.md ]; then
            if url=$(gh issue create --title "$(cat /tmp/issue.title)" --body-file /tmp/issue.md); then
              echo "$url" > data/latest_issue.txt
            else
              echo "::error::weekly issue 创建失败,见上方 gh 报错"
            fi
          else
            echo "::warning::/tmp/issue.md 为空,未创建周报 Issue"
          fi
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "weekly: $(date +%F)"
            # main 可能已前进(手动 push / 上一次运行),rebase 后再推;push 失败重试容忍远端瞬时抖动。
            for attempt in 1 2 3; do
              git pull --rebase --autostash
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

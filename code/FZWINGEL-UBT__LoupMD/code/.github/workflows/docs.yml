name: docs

# Builds the documentation site (mkdocs.yml, docs/) in strict mode and publishes it on GitHub Pages. The API
# reference is read from the package's sources without importing them, so the build needs neither a GPU nor the
# library nor the package's own dependencies: only the tools pinned in tools/docs/requirements.txt.
on:
  push:
    branches: [release/v1]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "loupmd/**"
      - "tools/docs/requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the documentation tools
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Build the site
        run: python -m mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

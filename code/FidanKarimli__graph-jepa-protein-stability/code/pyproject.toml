[project]
name = "pobj"
version = "0.1.0"
description = "Latent vs masked-residue pretraining for protein stability"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# petnica_project/ is the earlier course project, kept as it was. It has its own
# dependencies and expects to be run from its own directory.
testpaths = ["tests"]
addopts = "--ignore=petnica_project"

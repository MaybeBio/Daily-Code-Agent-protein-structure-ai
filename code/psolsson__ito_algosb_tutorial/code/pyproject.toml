[project]
name = "algosb-ito-practical"
version = "2026.11"
description = "AlgoSB 2026 practical: implicit transfer operators (minito on Wolfe-Quapp + TITO on proteins)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # deep learning (CPU is enough for everything in this practical)
    "torch==2.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'", # version used by platito; macOS >= 11
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # last build for Intel Macs
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "lightning>=2.4",
    "torchdiffeq>=0.2.5",
    "einops>=0.8",
    "omegaconf>=2.3",
    # science
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm",
    "deeptime>=0.4.4",
    "mdtraj>=1.10",
    # notebooks + visualisation
    "jupyterlab>=4",
    "ipywidgets>=8",
    "py3Dmol>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minito", "platito"]

[tool.uv]
# The lockfile must work on every laptop OS students may bring.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# CPU-only PyTorch on Linux/Windows (the default Linux wheel pulls ~3 GB of CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

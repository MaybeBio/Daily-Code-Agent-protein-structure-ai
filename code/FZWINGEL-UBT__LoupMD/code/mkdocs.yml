site_name: LoupMD
site_description: Molecular dynamics with MACE potentials on a C++/CUDA engine
# Plan task S7-T01. Build with `mkdocs build --strict` (the tools of tools/docs/requirements.txt). The site is
# published on GitHub Pages by .github/workflows/docs.yml (the owner's request of 18 November 2026).
site_url: https://fzwingel-ubt.github.io/LoupMD/
repo_url: https://github.com/FZWINGEL-UBT/LoupMD
repo_name: FZWINGEL-UBT/LoupMD
strict: true
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

# The design notes and validation records stay in the repository and are linked from the pages; they are not part of
# the site.
exclude_docs: |
  design/
  validation/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
  - Guides:
      - Molecular dynamics: guide/md.md
      - Constant pressure (NPT): guide/npt.md
      - Restart and resume: guide/restart.md
      - Relaxation: guide/relax.md
      - ASE: guide/ase.md
      - Models: guide/models.md
      - Large cells: guide/large-cells.md
      - Monte Carlo: guide/monte-carlo.md
      - Dispersion: guide/dispersion.md
      - Benchmark yourself: guide/benchmark.md
      - Coming from FastMACE: guide/from-fastmace.md
      - What LoupMD leaves out: guide/not-in-loupmd.md
      - FAQ: faq.md
  - Reference:
      - Command line: reference/cli.md
      - Models: reference/models.md
      - Integrators: reference/integrators.md
      - Output files: reference/output.md
      - Environment and caches: reference/environment.md
      - Errors: reference/errors.md
      - Python API: reference/api.md
  - Development: development.md

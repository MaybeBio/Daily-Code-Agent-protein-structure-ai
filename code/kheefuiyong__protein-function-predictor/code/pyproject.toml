[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-function-predictor"
version = "0.1.0"
description = "Protein function prediction using protein language models"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2",
    "transformers>=4.40,<6",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protein_function_predictor = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
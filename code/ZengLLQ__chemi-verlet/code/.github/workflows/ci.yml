name: ChemiVerlet CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint check with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Static type check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          chemi-verlet --help
          chemi-verlet demo --seed 42
          python -m chemi_verlet.cli simulate --steps 80 --ensemble nvt --seed 7
          python -m chemi_verlet.cli alchemical --windows 5 --steps-per-window 80 --seed 11
          python -m chemi_verlet.cli umbrella --windows 6 --steps-per-window 80 --seed 13
          python -m chemi_verlet.cli dock --smiles "CC(=O)Oc1ccccc1C(=O)O" --seed 5
          python -m chemi_verlet.cli msm --n-trajectories 4 --steps 120 --seed 19
          python -m chemi_verlet.cli calibrate --max-iter 15 --seed 23

      - name: Run standalone examples
        run: |
          python examples/01_solvated_ligand_pme_npt.py
          python examples/02_alchemical_hydration_mbar.py
          python examples/03_umbrella_wham_pmf_pulling.py
          python examples/04_msm_kinetics_and_docking.py

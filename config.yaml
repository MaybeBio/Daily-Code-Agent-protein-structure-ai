    - '"protein folding" "alphafold" in:name,description,readme,topics'
    # molecular dynamics × AI
    - '"molecular dynamics" "deep learning" in:name,description,readme,topics'
    - '"molecular dynamics" "machine learning" in:name,description,readme,topics'
    - '"molecular dynamics" "neural network" in:name,description,readme,topics'
    - '"molecular dynamics" "graph neural network" in:name,description,readme,topics'
    - '"molecular dynamics" "transformer" in:name,description,readme,topics'

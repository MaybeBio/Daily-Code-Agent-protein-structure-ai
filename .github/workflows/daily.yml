name: daily-feed
on:
  # 每日 05:00(上海时区)自动触发。daily 只负责沉淀每日 feed;weekly(周日 08:00)merge 时按
  # [run-window_days, run-1] 取窗口内的 feed(不含运行当天),所以当天 feed 会被下一次运行纳入
  # 之所以设置为5点是因为设置6点的话因为github延迟一般会导致8点多才开始跑，而我一天办公时间是早上8点开始，可以适当前调
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch: {}
concurrency: {group: daily-feed, cancel-in-progress: false}
permissions: {contents: write, issues: write}
env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  run:
    runs-on: ubuntu-latest
    # 实测单日候选 490~620 个,搜索 77 条约 7~8 分钟;打分由 config.yaml 的
    # llm.max_seconds(65 分钟)自己封顶,ingest 步骤另有 85 分钟步骤超时兜底。
    # job 设 110 是最后一道保险:65+8=73 分钟正常结束,撞到 110 说明预算/超时都没生效。
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install ghresearcher -r requirements.txt
      - name: llm doctor
        # 只做诊断,不阻断。打印脱敏后的端点、DNS/TCP/HTTP 结果和错误底层原因,
        # 端点不可达时能在日志第一屏看到是地址写错、DNS 还是网络不通。
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/llm_doctor.py
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      - run: python scripts/daily.py --config config.yaml --issue-body /tmp/issue.md --issue-title /tmp/issue.title
      # 仅当 config.yaml 的 ingest.mode=daily 时才真正执行;weekly 模式下脚本直接退出。
      # 负责把「昨天」的搜索+打分增量做完,weekly 只聚合,避免一次打分几千个仓库超时。
      - name: daily ingest
        # 失败不阻断后面的 commit:当日 feed 仍要落库;缺失的 scored 由 weekly 聚合补跑。
        continue-on-error: true
        # 必须小于 job 的 110 分钟:步骤超时会让 job 继续走 commit,而 job 超时会杀掉整个 job、
        # commit 直接 skipped(11-17、11-16 两次就是这样丢掉整天数据的)。
        # score.py 每 50 个仓库落盘一次,这里被杀也只损失未完成部分。
        timeout-minutes: 85
        run: python scripts/ingest_daily.py --config config.yaml
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily: $(date +%F)"
            # main 可能已前进(手动 push / 上一次运行),rebase 后再推;push 失败重试容忍远端瞬时抖动。
            for attempt in 1 2 3; do
              git pull --rebase --autostash
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
      - name: open issue
        run: |
          if [ -s /tmp/issue.md ]; then
            gh issue create --title "$(cat /tmp/issue.title)" --body-file /tmp/issue.md || true
          fi

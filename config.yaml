topic: protein-structure-ai
title: 蛋白质结构 × AI
# 课题词(领域定义)不在这里——它硬编码在 prompts.yaml 的 score/system 与 code_card/system 里。
# 换课题时改 prompts.yaml 的这两处措辞,以及下面的 search.queries / 命名。
# 抓取窗口长度(天)。窗口 = [运行日-window_days, 运行日-1](不含运行当天),
# search/merge/cards/issue 四处同源;cards 会把它写进每条记录,站点据此分组。
window_days: 7
# 本课题单周候选量约 2400(23 条查询,含 readme 匹配),weekly 集中打分约 1 小时,
# 会撞满 timeout-minutes。故用 daily:每天只抓/打分「昨天」(~1/7 的量),
# 周日只做 aggregate → archive → cards → issue。
ingest:
  mode: daily
  # 某天 daily 失败时,weekly 最多补跑 2 天;调大容易重新退化成集中打分。
  max_backfill_days: 2
site_base_url: https://MaybeBio.github.io/Daily-Code-Agent-protein-structure-ai
# 本模板仓库的 owner/name + 默认分支,用于构造 wiki 快照的 GitHub blob 链接
# (指向 code/{repo}/wikis/{date}/{source}/llms.txt)。
github_repo: MaybeBio/Daily-Code-Agent-protein-structure-ai
github_branch: main
search_placeholder: 如 蛋白结构预测、蛋白互作、蛋白功能、AlphaFold
llm:
  concurrency: 8
  min_score: 5
archive:
  # degit + repowiki-cli 的网络并发数。串行太慢(55 仓库 ~4h),太高会触发
  # repowiki(deepwiki/zread)限流 —— 实测串行时仍有 47/55 wiki 失败,故取低并发。
  concurrency: 4
daily:
  enable_repo_table: true
  watchlists:
    users: monitor/lists/users.txt
    users_core: monitor/lists/users_core.txt
    orgs: monitor/lists/orgs.txt
search:
  config: queries/search_repos.yaml
  # GitHub 仓库搜索:多查询并集(逐条查询后按 full_name 去重)。换课题时改这里。
  # ⚠️ 为什么拆成多条、而不是一条 `A OR B OR C ... in:字段`:
  #    GitHub 硬限制「每条查询最多 5 个 AND/OR/NOT 运算符」,超过直接报
  #    "More than five AND / OR / NOT operators were used"。备选短语一多(本项目 8~9 个),
  #    单条 OR 会被拒绝,只能拆成多条(每条 ≤6 项)各自查询、按 full_name 取并集。
  #    (AI4Bio 那条 OR 是 5 个词=4 个 OR,恰好卡在上限内;再加一项就会挂。)
  #    `in:` 是字段限定、OR 是词间逻辑,两者可共存;`in:` 作用于整条查询(与位置无关)。
  # ⚠️ 每条查询都用「引号短语 + in:name,description,readme,topics」:
  #    裸词是 AND(单词都出现)而非固定词组,召回翻倍但多是噪声;
  #    裸 2~3 字母缩写(MD/PDB/AF)会被子串命中(如 "MD" 命中一堆无关词),故一律避开裸缩写;
  #    含 readme:召回更高,契合"宽召回 → 打分过滤";代价是噪声变多、LLM 打分成本上升。
  #    想省成本就从每行去掉 `,readme`。带 --updated 时间窗后 readme 不会超限。
  queries:
    # 短语查询(蛋白结构 × AI/模拟 的核心术语)
    - '"protein structure prediction" in:name,description,readme,topics'
    - '"protein structure" in:name,description,readme,topics'
    - '"structure prediction" in:name,description,readme,topics'
    - '"protein folding" in:name,description,readme,topics'
    - '"conformational sampling" in:name,description,readme,topics'
    - '"molecular docking" in:name,description,readme,topics'
    - '"molecular dynamics" in:name,description,readme,topics'
    - '"protein language model" in:name,description,readme,topics'
    - '"protein design" in:name,description,readme,topics'
    - '"protein interaction" in:name,description,readme,topics'
    - '"protein function" in:name,description,readme,topics'
    # topic: 是「仓库标签」精确匹配(非子串),补充召回最稳的一路。命中数是 2026-10-23
    # 全库总量(非周窗),仅作相对热度参考;带 --updated 时间窗后每周实际命中远小于此。
    - 'topic:protein-structure'              # 881
    - 'topic:protein-structure-prediction'   # 132
    - 'topic:alphafold'                      # 255
    - 'topic:protein-folding'                # 163
    - 'topic:protein-design'                 # 356
    - 'topic:protein-modeling'               # 22
    - 'topic:structure-based-drug-design'    # 35
    - 'topic:protein-engineering'            # 147
    - 'topic:docking'                        # 302
    - 'topic:molecular-dynamics'             # 1660(很宽,含材料/化学等,靠打分过滤)
    - 'topic:protein-interaction'    # 244
    - 'topic:protein-function'    # 66

topic: protein-structure-ai
title: 蛋白质结构 × AI
# 课题词(领域定义)不在这里——它硬编码在 prompts.yaml 的 score/system 与 code_card/system 里。
# 换课题时改 prompts.yaml 的这两处措辞,以及下面的 search.queries / 命名。
# 抓取窗口长度(天)。窗口 = [运行日-window_days, 运行日-1](不含运行当天),
# search/merge/cards/issue 四处同源;cards 会把它写进每条记录,站点据此分组。
window_days: 7
# 本课题单周候选量约 2400(23 条查询,含 readme 匹配),weekly 集中打分约 1 小时,
# 会撞满 timeout-minutes。故用 daily:每天只抓/打分「昨天」(~1/7 的量),
# 周日只做 aggregate → archive → cards → issue。
ingest:
  mode: daily
  # 某天 daily 失败时,weekly 最多补跑 2 天;调大容易重新退化成集中打分。
  max_backfill_days: 2
site_base_url: https://MaybeBio.github.io/Daily-Code-Agent-protein-structure-ai
# 本模板仓库的 owner/name + 默认分支,用于构造 wiki 快照的 GitHub blob 链接
# (指向 code/{repo}/wikis/{date}/{source}/llms.txt)。
github_repo: MaybeBio/Daily-Code-Agent-protein-structure-ai
github_branch: main
search_placeholder: 如 蛋白结构预测、蛋白互作、蛋白功能、AlphaFold
llm:
  concurrency: 8
  min_score: 5
  # noagent 降级开关:false 时跳过 LLM(打分/Code Card)。issue 仍全量列仓库,
  # 但站点/归档/wiki 只留 watchlist 来源;配合 archive.repo_copy: readme 一起用。
  # api 欠费/不可用时手动切 false,重跑该周 action 即可。
  enabled: true
archive:
  # 高分仓库落盘方式:code=只保留代码语料(源码/构建配置/README/文档;数据、
  # 图片、权重、二进制、通用 txt/log/csv/json/xml 不留,普通源码>2 MB、文档/构建>1 MB 不留,README/ipynb 不设限),省略
  # 清单写在该仓库的 MANIFEST.md;full=完整浅克隆;readme=只留 README + 目录树。
  repo_copy: code
  # degit + repowiki-cli 的网络并发数。串行太慢(55 仓库 ~4h),太高会触发
  # repowiki(deepwiki/zread)限流 —— 实测串行时仍有 47/55 wiki 失败,故取低并发。
  concurrency: 4
daily:
  enable_repo_table: true
  watchlists:
    users: monitor/lists/users.txt
    users_core: monitor/lists/users_core.txt
    orgs: monitor/lists/orgs.txt
search:
  config: queries/search_repos.yaml
  # GitHub 仓库搜索:多查询并集(逐条查询后按 full_name 去重)。换课题时改这里。
  # ⚠️ 为什么拆成多条、而不是一条 `A OR B OR C ... in:字段`:
  #    GitHub 硬限制「每条查询最多 5 个 AND/OR/NOT 运算符」,超过直接报
  #    "More than five AND / OR / NOT operators were used"。备选短语一多(本项目 8~9 个),
  #    单条 OR 会被拒绝,只能拆成多条(每条 ≤6 项)各自查询、按 full_name 取并集。
  #    (AI4Bio 那条 OR 是 5 个词=4 个 OR,恰好卡在上限内;再加一项就会挂。)
  #    `in:` 是字段限定、OR 是词间逻辑,两者可共存;`in:` 作用于整条查询(与位置无关)。
  # ⚠️ 每条查询都用「引号短语 + in:字段」:
  #    裸词是 AND(单词都出现)而非固定词组,召回翻倍但多是噪声;
  #    裸 2~3 字母缩写(MD/PDB/AF)会被子串命中(如 "MD" 命中一堆无关词),故一律避开裸缩写。
  # ⚠️ 检索策略(2026-10-23 调整):从「宽召回 → 打分过滤」改为「分层召回」。
  #    原方案所有短语都搜 readme,单日 803 个候选,免费模型端点(6~77 次/分)根本跑不完。
  #    现在按「这个字段能不能证明仓库身份」分两层:
  #      1) 身份字段(name/description/topics):出现短语即收 —— 这些字段是仓库自我定位,噪声低;
  #      2) 主题短语 × AI 词:两个词必须同时出现(AND),挡掉 README 里只顺带提一句
  #         "protein structure"/"molecular dynamics" 的蹭词仓库,同时不丢真正做 AI+结构的项目。
  #    实测 2026-10-22 单日:803 → 385 个(身份 73 + 网格 304 + topic 63,有重叠);
  #    另一天(10-21)同一思路约 200 出头,单日量随科研活动波动。
  #    ⚠️ 不要写成 `"A" "B" OR "C" in:...`:实测 OR 会丢掉前面的 AND 约束
  #    (返回 72 条 > 两个单独查询之和),必须一个 AI 词一条查询。
  #    ⚠️ 查询条数 77 条,search.py 每条间隔 3 秒,整体约 5 分钟;仍在 30 次/分的搜索限流内。
  queries:
    # ── 第 1 层:身份字段(name/description/topics),不看 readme
    - '"protein structure prediction" in:name,description,topics'
    - '"protein structure" in:name,description,topics'
    - '"structure prediction" in:name,description,topics'
    - '"protein folding" in:name,description,topics'
    - '"conformational sampling" in:name,description,topics'
    - '"molecular docking" in:name,description,topics'
    - '"molecular dynamics" in:name,description,topics'
    - '"protein language model" in:name,description,topics'
    - '"protein design" in:name,description,topics'
    - '"protein interaction" in:name,description,topics'
    - '"protein function" in:name,description,topics'
    # ── 第 2 层:主题短语 × AI 词(AND),两个词都要出现才收
    #    词表刻意放宽:实测 6 个 AI 词已覆盖 grid 的 287 个,加到 9 个只多 11 个仓库
    #    (2026-10-22),所以多列几个词的代价很小,但漏一个词(如 language model)会整类漏掉。
    #    ⚠️ 一个 AI 词一条查询,不能写成 `"A" "B" OR "C"`:实测 OR 会丢掉前面的 AND 约束。
    # protein structure × AI
    - '"protein structure" "deep learning" in:name,description,readme,topics'
    - '"protein structure" "machine learning" in:name,description,readme,topics'
    - '"protein structure" "neural network" in:name,description,readme,topics'
    - '"protein structure" "graph neural network" in:name,description,readme,topics'
    - '"protein structure" "transformer" in:name,description,readme,topics'
    - '"protein structure" "diffusion model" in:name,description,readme,topics'
    - '"protein structure" "generative model" in:name,description,readme,topics'
    - '"protein structure" "language model" in:name,description,readme,topics'
    - '"protein structure" "alphafold" in:name,description,readme,topics'
    # protein folding × AI
    - '"protein folding" "deep learning" in:name,description,readme,topics'
    - '"protein folding" "machine learning" in:name,description,readme,topics'
    - '"protein folding" "neural network" in:name,description,readme,topics'
    - '"protein folding" "graph neural network" in:name,description,readme,topics'
